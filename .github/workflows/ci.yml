name: Build and test

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InternalManagement.slnx

      - name: Build solution
        run: dotnet build InternalManagement.slnx --configuration Release --no-restore --nologo -v:quiet

      - name: Enforce source-size budget
        shell: pwsh
        run: ./tools/VerifySourceSize.ps1

      - name: Unit tests
        run: dotnet test tests/InternalManagement.UnitTests/InternalManagement.UnitTests.csproj --configuration Release --no-build --nologo --blame-hang-timeout 5m --logger "trx;LogFileName=unit.trx"

      - name: Desktop client tests
        run: dotnet test tests/InternalManagement.DesktopTests/InternalManagement.DesktopTests.csproj --configuration Release --no-build --nologo --blame-hang-timeout 5m --logger "trx;LogFileName=desktop.trx"

      - name: API integration tests (in-memory host)
        run: dotnet test tests/InternalManagement.IntegrationTests/InternalManagement.IntegrationTests.csproj --configuration Release --no-build --nologo --filter "FullyQualifiedName!~PostgreSqlIntegrationTests" --blame-hang-timeout 5m --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
          if-no-files-found: ignore

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: PostgreSQL migration and concurrency tests
        env:
          RUN_POSTGRES_TESTS: 'true'
        run: >-
          dotnet test tests/InternalManagement.IntegrationTests/InternalManagement.IntegrationTests.csproj
          --configuration Release --nologo
          --filter "FullyQualifiedName~PostgreSqlIntegrationTests"
          --blame-hang-timeout 5m
